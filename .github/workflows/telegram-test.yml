name: Probar Telegram
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Enviar mensaje de prueba al chat privado
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          from src.telegram import send_message
          send_message("Prueba correcta: Xiaomi Price Monitor ya puede enviarte alertas automáticas en Telegram.")
          print("Telegram confirmó el envío del mensaje de prueba.")
          PY
