name: Probar notificacion Telegram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enviar mensaje de prueba
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              sys.exit("Faltan secretos TELEGRAM_BOT_TOKEN y/o TELEGRAM_CHAT_ID en Settings > Secrets and variables > Actions.")

          payload = json.dumps({
              "chat_id": chat_id,
              "text": "✅ Prueba correcta: Xiaomi Price Monitor ya puede enviar alertas por Telegram.\nGitHub: FerMartinez17125/xiaomi-price-monitor",
              "disable_web_page_preview": True,
          }).encode("utf-8")
          req = urllib.request.Request(
              "https://api.telegram.org/bot" + token + "/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  sys.exit("Telegram rechazó el mensaje. Verifica los secretos y que enviaste /start al bot.")
              print("Telegram recibió el mensaje de prueba correctamente.")
          except urllib.error.HTTPError as exc:
              print("Error de Telegram HTTP", exc.code)
              sys.exit("Comprueba bot token, chat_id y que el chat haya iniciado /start.")
          except urllib.error.URLError:
              sys.exit("No fue posible contactar Telegram. Intenta nuevamente.")
          PY
